name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Page helper against a fake Kobo, skill docs
        run: python -m unittest discover -s tests -v
      - name: Manifests are valid JSON
        run: for f in .claude-plugin/marketplace.json plugins/kobo/.claude-plugin/plugin.json; do python -m json.tool "$f" >/dev/null || exit 1; done
